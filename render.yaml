# Deploy on Render: New + > Blueprint > pick this repo.
# Render asks for every variable marked sync:false. No secrets are stored in the repo.
services:
  - type: web
    name: omega
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # 1 worker + threads: the free plan has 512 MB RAM and OpenCV/scikit-learn are heavy.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: omega-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "1"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: BASE_URL
        sync: false   # your Render URL, e.g. https://omega.onrender.com (no trailing slash)
databases:
  - name: omega-db
    plan: free
