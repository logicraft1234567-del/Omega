{% extends 'base.html' %}{% block title %}Profile · Omega{% endblock %}
{% block content %}
<h1 class="h2">Your profile</h1>
<form method="post" enctype="multipart/form-data" class="glass pad mt" style="max-width:720px"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="row" style="margin-bottom:20px">{% if current_user.photo %}<img class="avatar" style="width:64px;height:64px" src="{{ url_for('market.product_media', name=current_user.photo) }}" alt="">{% else %}<span class="avatar" style="width:64px;height:64px">{{ current_user.initials }}</span>{% endif %}
    <div><b>{{ current_user.email }}</b><br><span class="badge b-mute">{{ current_user.role }}</span></div></div>
  <div class="form-grid"><div class="field"><label>Name</label><input type="text" name="name" value="{{ current_user.name }}"></div><div class="field"><label>Phone</label><input type="tel" name="phone" value="{{ current_user.phone or '' }}"></div>
  <div class="field"><label>Location</label><input type="text" name="location" value="{{ current_user.location or '' }}"></div><div class="field"><label>PayPal email (payouts)</label><input type="email" name="paypal_email" value="{{ current_user.paypal_email or '' }}"></div></div>
  <div class="field"><label>Bio</label><textarea name="bio" maxlength="400">{{ current_user.bio or '' }}</textarea></div>
  <div class="field"><label>Photo</label><input type="file" name="photo" accept="image/*"></div>
  <button class="btn btn-primary">Save profile</button>
</form>
{% endblock %}
