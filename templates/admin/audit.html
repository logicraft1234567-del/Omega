{% extends 'base.html' %}{% block title %}Audit log · Admin{% endblock %}
{% block content %}<h1 class="h2">Audit log</h1><div class="mt">{% include 'admin/_nav.html' %}</div>
<div class="glass pad"><div class="table-wrap"><table class="o"><tr><th>When</th><th>Actor</th><th>Action</th><th>Target</th><th>Detail</th></tr>{% for a in rows %}<tr><td class="small muted">{{ a.created_at|dt }}</td><td>{{ a.actor }}</td><td><span class="badge">{{ a.action }}</span></td><td class="mono small">{{ a.target }}</td><td class="small muted">{{ a.detail }}</td></tr>{% endfor %}</table></div></div>{% endblock %}
